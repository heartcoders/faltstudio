<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap"
    />
    <title>Viewer eingebettet</title>
    <style>
      body {
        margin: 0;
        background: #ececec;
        color: #1f1f1f;
        font-family: Georgia, serif;
      }

      main {
        max-inline-size: 720px;
        margin-inline: auto;
        padding: 48px 16px;
      }

      h1 {
        font-size: 44px;
        font-weight: 400;
        line-height: 1.1;
      }

      p {
        font-size: 18px;
        line-height: 1.65;
      }

      figure {
        margin: 32px 0;
      }

      figcaption {
        margin-block-start: 8px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }

      fl-viewer:not(:defined) {
        visibility: hidden;
      }
    </style>
    <script type="module" src="/src/embed.ts"></script>
  </head>
  <body>
    <main>
      <h1>Warum der einfachste Papierflieger am weitesten gleitet</h1>
      <p>
        Demo-Seite für das eingebettete Widget (S7). Der Viewer bringt eigene Tokens mit und
        verändert das Dokument der Gastseite nicht.
      </p>
      <figure>
        <fl-viewer embedded src="/dart-a4.json"></fl-viewer>
        <figcaption>Interaktiv: Ziehen Sie die Ecke oder tippen Sie auf „Weiter“.</figcaption>
      </figure>
      <p>Entscheidend sind die Schritte vier und fünf.</p>
    </main>
  </body>
</html>
